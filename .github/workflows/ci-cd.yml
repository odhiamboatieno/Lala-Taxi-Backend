name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST — install deps, lint syntax, run the PHPUnit suite
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      corporate-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_DATABASE: lala_corporate_schema_test
        ports: ["33317:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, sockets, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Lint PHP syntax
        run: |
          find app config database routes Modules tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # Blade directives are not valid PHP, so views can only be checked after
      # they are compiled. This catches malformed PHP inside a .blade.php file,
      # which php artisan view:cache does not detect on its own.
      - name: Lint compiled Blade views
        run: |
          php artisan view:clear
          php artisan view:cache
          find storage/framework/views -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "compiled views linted OK"

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      - name: Verify corporate MySQL migrations, concurrency and retention
        env:
          DB_PASSWORD: isolated-ci-only
        run: vendor/bin/phpunit -c phpunit.corporate-mysql.xml --no-coverage

      - name: Verify reproducible mobile contract
        env:
          CORPORATE_EXPORT_MOBILE_CONTRACT: "1"
        run: |
          vendor/bin/phpunit --no-coverage --filter test_mobile_contract_and_finance_settlement
          git diff --exit-code -- tests/fixtures/corporate-mobile-contract.json

      - name: Verify isolated acceptance provisioning on the full schema
        env:
          DB_PASSWORD: isolated-ci-only
        run: |
          php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=33317", "root", getenv("DB_PASSWORD")); $pdo->exec("CREATE DATABASE IF NOT EXISTS lala_corporate_acceptance_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          vendor/bin/phpunit -c phpunit.corporate-acceptance.xml --no-coverage

      - name: Validate release scripts and cached routes
        run: |
          sh -n deploy/preflight.sh deploy/release.sh docker/entrypoint.sh
          php -l docker/audit-code.php
          APP_ROUTES_CACHE="$(mktemp -d)/corporate-routes.php" php artisan route:cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results
          path: storage/logs/laravel.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. BUILD — build & push the image to GHCR (runs after tests pass)
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: RELEASE_SHA=${{ github.sha }}

      - name: Image summary
        run: echo "Pushed image -> ${{ steps.meta.outputs.tags }}"

  # ---------------------------------------------------------------------------
  # 3. PACKAGE — build a ready-to-copy deployment bundle (runs after build)
  # ---------------------------------------------------------------------------
  package:
    name: Package deploy bundle
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy bundle
        run: |
          mkdir -p bundle
          cp deploy/docker-compose.yml bundle/
          cp deploy/nginx.conf bundle/
          cp deploy/.env.example bundle/.env.example
          cp deploy/README.md bundle/README.md
          cp deploy/CORPORATE_RELEASE.md bundle/
          cp deploy/preflight.sh deploy/release.sh bundle/
          cp docs/corporate-implementation-progress.md bundle/
          printf '{"commit":"%s","image":"ghcr.io/%s@%s","corporate_bookings_enabled":false}\n' \
            "$GITHUB_SHA" "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" \
            '${{ needs.build.outputs.digest }}' > bundle/release-manifest.json
          sha256sum tests/fixtures/corporate-mobile-contract.json > bundle/mobile-contract.sha256
          tar -czf lalataxi-deploy.tar.gz -C bundle .

      - name: Upload deploy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: lalataxi-deploy-bundle
          path: lalataxi-deploy.tar.gz
          retention-days: 30

      - name: Release notes summary
        run: |
          echo "Deploy bundle ready. Download 'lalataxi-deploy-bundle' from this run's artifacts."
          echo "Use the pinned digest in release-manifest.json and the backup/restore-gated release.sh runbook. No SSH deployment was performed."
