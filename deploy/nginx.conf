server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Pass through the real visitor IP (LalaTaxi apps use it for rate limiting).
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets with aggressive caching.
    location ~* \.(?:css|js|gif|jpe?g|png|svg|ico|woff2?|ttf|eot|json|map|mp3|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Re-resolve the app container through Docker's DNS so recreating the
        # app (which changes its IP) does not leave nginx pointing at a dead
        # upstream and returning 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
