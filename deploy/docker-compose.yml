name: lalataxi

services:
  app:
    image: ${LALATAXI_IMAGE:?Set LALATAXI_IMAGE to the tested immutable image digest}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      RUN_MIGRATIONS: "true"
      SYNC_CODE: "true"
      REBUILD_CACHES: "true"
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
      - app_trip_files:/var/www/html/public/trip_file
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [lalataxi]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # The published address is configurable: on hosts where a web server
    # (e.g. aaPanel/nginx) already owns :80, set NGINX_BIND=127.0.0.1:8081
    # and reverse-proxy the domain to it.
    ports:
      - "${NGINX_BIND:-0.0.0.0:80}:80"
    volumes:
      - app_code:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [lalataxi]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Permissive sql_mode: the LalaTaxi schema uses timestamp DEFAULT '0000-00-00'
    # (legacy zero dates) which strict mode rejects.
    command: ["--sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lalataxi}
      MYSQL_USER: ${DB_USERNAME:-lalataxi}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set the existing MySQL root password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [lalataxi]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lalataxi]

  queue:
    image: ${LALATAXI_IMAGE:?Set LALATAXI_IMAGE to the tested immutable image digest}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      SYNC_CODE: "false"
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
      - app_trip_files:/var/www/html/public/trip_file
    depends_on:
      app:
        condition: service_healthy
    networks: [lalataxi]

  reverb:
    image: ${LALATAXI_IMAGE:?Set LALATAXI_IMAGE to the tested immutable image digest}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      RUN_MIGRATIONS: "false"
      SYNC_CODE: "false"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
      - app_trip_files:/var/www/html/public/trip_file
    depends_on:
      app:
        condition: service_healthy
    networks: [lalataxi]

  scheduler:
    image: ${LALATAXI_IMAGE:?Set LALATAXI_IMAGE to the tested immutable image digest}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      SYNC_CODE: "false"
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
      - app_trip_files:/var/www/html/public/trip_file
    depends_on:
      app:
        condition: service_healthy
    networks: [lalataxi]

volumes:
  app_code:
  app_storage:
  app_trip_files:
  mysql_data:
  redis_data:

networks:
  lalataxi:
    driver: bridge
